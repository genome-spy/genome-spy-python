repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.15
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Preserve generated JavaScript strings and the verbatim upstream license.
        exclude: '^(src/genome_spy/static/(genome-spy|controls|inspector)\.js|LICENSES/LATO-OFL-1\.1\.txt)$'
