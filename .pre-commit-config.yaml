repos:
  - repo: local
    hooks:
      - id: no-test-artifacts
        name: keep generated test artifacts out of Git
        language: fail
        entry: Generated test media and benchmark reports belong in temporary directories, not Git.
        files: '(?i)^tests/.*(?:\.(?:png|jpe?g|gif|webp|svg|pdf|mp4|webm|mov|avi|bmp|tiff?|avif|html|h5ad|h5|parquet|arrow|feather|npz|npy|pkl|pickle)|performance[^/]*\.json)$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.15
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Preserve generated JavaScript strings and the verbatim upstream license.
        exclude: '^(src/genome_spy/static/(genome-spy|controls|inspector)\.js|LICENSES/LATO-OFL-1\.1\.txt)$'
