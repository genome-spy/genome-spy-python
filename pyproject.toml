[project]
name = "genome-spy-python"
version = "0.1.0"
description = "genome-spy-python is a declarative genomics visualization library for Python, built on top of the genome-spy JSON specification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.18",
    "jsonschema>=4.26.0",
    "traitlets>=5.14.3",
]

[dependency-groups]
dev = [
    "altair>=6.0.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.3",
    "mypy>=1.16.1",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pandas>=2.3.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genome_spy"]
artifacts = ["src/genome_spy/schema/genome-spy-schema.json"]

[tool.genome-spy]
core-version = "0.80.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501", "S101"]
