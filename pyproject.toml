[project]
name = "genome-spy-python"
version = "0.1.0"
description = "genome-spy-python is a declarative genomics visualization library for Python, built on top of the genome-spy JSON specification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-3-Clause"
license-files = [
    "LICENSE",
    "LICENSES/ALTAIR-BSD-3-Clause.txt",
    "THIRD_PARTY_NOTICES.md",
]
authors = [{ name = "Oskari Lehtonen", email = "oskarilehtonen4@gmail.com" }]
keywords = ["genomics", "visualization", "genome-spy", "jupyter", "anywidget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: Jupyter",
]
dependencies = [
    "anywidget>=0.9.18",
    "jsonschema>=4.26.0",
    "traitlets>=5.14.3",
]

[project.urls]
Homepage = "https://github.com/genome-spy/genome-spy-python"
Documentation = "https://genomespy.app/genome-spy-python/"
Repository = "https://github.com/genome-spy/genome-spy-python"
Issues = "https://github.com/genome-spy/genome-spy-python/issues"

[project.optional-dependencies]
arrow = ["pyarrow>=18.0.0"]

[dependency-groups]
docs = [
    "furo>=2024.8.6",
    "sphinx>=7.3",
    "myst-parser>=3.0",
    "scipy>=1.14.0",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "sphinx-github-style>=1.2.2",
    "statsmodels>=0.14.2",
    "pyarrow>=18.0.0",
]
dev = [
    "altair>=6.0.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.3",
    "mypy>=1.16.1",
    "marimo>=0.23.14",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pandas>=2.3.0",
    "pyarrow>=18.0.0",
    "pre-commit>=4.2.0",
    "polars>=1.33.1",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genome_spy"]
artifacts = [
    "src/genome_spy/schema/capabilities.json",
    "src/genome_spy/schema/genome-spy-schema.json",
    "src/genome_spy/datasets/data/*.csv",
    "src/genome_spy/datasets/data/*.gz",
    "src/genome_spy/datasets/data/*.json",
    "src/genome_spy/datasets/data/*.tsv",
    "src/genome_spy/static/widget.js",
]

[tool.genome-spy]
core-version = "0.85.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "codegen: schema-generation tooling tests run by the dedicated codegen job",
    "docs: documentation and gallery tests excluded from package CI",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501", "S101"]
