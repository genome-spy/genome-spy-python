name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow as a pre-publish gate.
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      # Formatting, linting, and typing are platform-independent, so one
      # runner checks them for the whole matrix.
      - if: runner.os == 'Linux'
        run: uv run ruff format --check .
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run mypy src/
      - name: Run package tests
        run: >-
          uv run pytest tests/ -x
          -m "not docs and not codegen"
          --durations=10
      - run: node --test tests/widget.test.mjs
      - run: uv build --wheel
      # Portable across the shells the matrix runs: bash on Linux, PowerShell
      # on Windows.
      - name: Check wheel contents and license metadata
        run: >-
          uv run python -c "import glob, zipfile; wheel = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); names = wheel.namelist(); metadata = wheel.read(next(name for name in names if name.endswith('.dist-info/METADATA'))).decode(); metadata_lines = set(metadata.splitlines()); assert 'genome_spy/static/widget.js' in names, names; assert any(name.endswith('.dist-info/licenses/LICENSE') for name in names), names; assert any(name.endswith('.dist-info/licenses/LICENSES/ALTAIR-BSD-3-Clause.txt') for name in names), names; assert any(name.endswith('.dist-info/licenses/THIRD_PARTY_NOTICES.md') for name in names), names; assert {'License-Expression: MIT AND BSD-3-Clause', 'License-File: LICENSE', 'License-File: LICENSES/ALTAIR-BSD-3-Clause.txt', 'License-File: THIRD_PARTY_NOTICES.md'} <= metadata_lines, metadata"

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run pytest tests/test_schema_codegen.py -x --durations=10
      - run: uv run python tools/generate_schema_wrapper.py
      - run: uv run ruff format src/genome_spy/schema
      - run: git diff --exit-code src/genome_spy/schema tools
