name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_scanpy:
        description: Run all Scanpy references, browsers and workflows
        type: boolean
        default: false
  # Reused by the release workflow as a pre-publish gate.
  workflow_call:
    inputs:
      full_scanpy:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked --dev
      # Formatting, linting, and typing are platform-independent, so one
      # runner checks them for the whole matrix.
      - if: runner.os == 'Linux'
        run: uv run ruff format --check .
      - if: runner.os == 'Linux'
        run: uv run ruff check .
      - if: runner.os == 'Linux'
        run: uv run mypy src/
      - name: Run package tests
        run: >-
          uv run pytest tests/ -x --ignore=tests/integrations/scanpy
          -m "not docs and not codegen"
          --durations=10
      - run: node --test tests/*.test.mjs
      - run: uv build --wheel
      # Use Bash on both runners for the embedded Python script.
      - name: Check wheel contents and license metadata
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tomllib
          import zipfile

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          with zipfile.ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              names = wheel.namelist()
              metadata_path = next(n for n in names if n.endswith('.dist-info/METADATA'))
              metadata = set(wheel.read(metadata_path).decode().splitlines())
              prefix = metadata_path.removesuffix('METADATA') + 'licenses/'
              assert 'genome_spy/static/widget.js' in names
              assert 'genome_spy/static/genome-spy.js' in names
              assert 'genome_spy/static/controls.js' in names
              assert 'genome_spy/static/inspector.js' in names
              assert 'License-Expression: ' + project['license'] in metadata
              for name in project['license-files']:
                  assert 'License-File: ' + name in metadata
                  assert wheel.read(prefix + name) == Path(name).read_bytes(), name
          PY
      - if: runner.os == 'Linux'
        name: Smoke-test installed wheel
        working-directory: /tmp
        run: >-
          uv run --isolated --no-project
          --with "$GITHUB_WORKSPACE"/dist/*.whl
          python -c "from importlib.resources import files; import genome_spy as gs; package = files('genome_spy'); assert package.joinpath('schema/genome-spy-schema.json').is_file(); assert package.joinpath('schema/capabilities.json').is_file(); assert package.joinpath('static/widget.js').is_file(); assert package.joinpath('static/genome-spy.js').is_file(); assert package.joinpath('static/controls.js').is_file(); assert package.joinpath('static/inspector.js').is_file(); chart = gs.Chart([{'x': 1}]).mark_point().encode(x='x:Q'); spec = chart.to_dict(); assert spec['mark'] == 'point'; assert spec['encoding']['x']['field'] == 'x'; assert spec[chr(36) + 'schema'].endswith('/schema.json')"

  scanpy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.full_scanpy) && '["3.11", "3.12", "3.13"]' || '["3.11"]') }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --dev --extra scanpy --group scanpy-test
      - name: Fast Scanpy checks
        if: github.ref != 'refs/heads/main' && !inputs.full_scanpy
        run: >-
          uv run --no-sync pytest tests/integrations/scanpy
          --ignore=tests/integrations/scanpy/browser
          -m "not reference and not workflow" -q --durations=10
      - name: Full Scanpy checks
        if: github.ref == 'refs/heads/main' || inputs.full_scanpy
        run: >-
          uv run --no-sync pytest tests/integrations/scanpy
          --ignore=tests/integrations/scanpy/browser -q --durations=10
      # The renderer is JavaScript; repeat it once, rather than for each Python.
      - if: matrix.python == '3.11'
        run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Browser smoke checks
        if: matrix.python == '3.11' && github.ref != 'refs/heads/main' && !inputs.full_scanpy
        run: >-
          uv run --no-sync pytest tests/integrations/scanpy/browser -m smoke -q
          --basetemp="${{ runner.temp }}/scanpy-browser"
      - name: Full browser checks
        if: matrix.python == '3.11' && (github.ref == 'refs/heads/main' || inputs.full_scanpy)
        run: >-
          uv run --no-sync pytest tests/integrations/scanpy/browser -q
          --basetemp="${{ runner.temp }}/scanpy-browser"
      - name: Render the workflow notebooks in JupyterLab
        if: matrix.python == '3.11' && (github.ref == 'refs/heads/main' || inputs.full_scanpy)
        run: |
          uv run --no-sync python tools/check_notebook_rendering.py integrations/scanpy/notebooks/scanpy_umap.ipynb --screenshot "${{ runner.temp }}/scanpy-browser/umap-notebook.png"
          uv run --no-sync python tools/check_notebook_rendering.py integrations/scanpy/notebooks/scanpy_expression.ipynb --screenshot "${{ runner.temp }}/scanpy-browser/expression-notebook.png"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.python == '3.11'
        with:
          name: scanpy-browser
          path: ${{ runner.temp }}/scanpy-browser
          if-no-files-found: ignore

  scanpy-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install current Scanpy separately from the reference environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/scanpy-compat"
          uv pip install --python "$RUNNER_TEMP/scanpy-compat/bin/python" \
            -e '.[scanpy]' 'scanpy==1.12.4' pytest pillow playwright pyarrow
      - name: Fast compatibility checks
        if: github.ref != 'refs/heads/main' && !inputs.full_scanpy
        run: >-
          "$RUNNER_TEMP/scanpy-compat/bin/python" -m pytest
          tests/integrations/scanpy --ignore=tests/integrations/scanpy/browser
          -m "not reference and not workflow" -q --durations=10
      - name: Full compatibility checks
        if: github.ref == 'refs/heads/main' || inputs.full_scanpy
        run: >-
          "$RUNNER_TEMP/scanpy-compat/bin/python" -m pytest
          tests/integrations/scanpy --ignore=tests/integrations/scanpy/browser -q
      - if: github.ref == 'refs/heads/main' || inputs.full_scanpy
        run: '"$RUNNER_TEMP/scanpy-compat/bin/python" -m playwright install --with-deps chromium'
      - name: Check native interactions with current Scanpy
        if: github.ref == 'refs/heads/main' || inputs.full_scanpy
        run: >-
          "$RUNNER_TEMP/scanpy-compat/bin/python" -m pytest
          tests/integrations/scanpy/browser/test_grid_interactions.py
          tests/integrations/scanpy/browser/test_brushing.py
          tests/integrations/scanpy/browser/test_embedding_summary.py
          tests/integrations/scanpy/browser/test_embedding_summary_tracks.py
          -q --basetemp="${{ runner.temp }}/scanpy-compat-browser"

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run pytest tests/test_schema_codegen.py -x --durations=10
      - run: uv run python tools/generate_schema_wrapper.py
      - run: uv run python tools/vendor_javascript.py
      - run: uv run ruff format src/genome_spy/schema src/genome_spy/helpers.py src/genome_spy/api.py src/genome_spy/__init__.py
      - run: git diff --exit-code src/genome_spy/schema src/genome_spy/static src/genome_spy/helpers.py src/genome_spy/api.py src/genome_spy/__init__.py tools LICENSES

  notebook-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
      - run: uv build --wheel
      - name: Install the wheel with the minimum supported AnyWidget
        run: |
          uv venv --seed --python 3.11 "$RUNNER_TEMP/notebook-env"
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            uv pip install --python "$RUNNER_TEMP/notebook-env/bin/python" \
              "$wheel[arrow]" "anywidget==0.11.0" jupyterlab pandas numpy scipy statsmodels playwright pillow pytest aiohttp
          done
          "$RUNNER_TEMP/notebook-env/bin/python" -m playwright install --with-deps chromium
      - name: Verify offline HTML from the installed wheel
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" -m pytest tests/browser/ -q
      - name: Render the brush notebook in JupyterLab
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/brush_linked_genome_tracks.ipynb \
            --screenshot "$RUNNER_TEMP/notebook-rendering.png"
      - name: Exercise the embed API through Jupyter comms
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/embed_api.ipynb \
            --check-embed-interactions \
            --screenshot "$RUNNER_TEMP/embed-api.png"
      - name: Exercise interactive workflows and file exports
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/annotate_genomic_intervals.ipynb --workflow intervals \
            --screenshot "$RUNNER_TEMP/annotate-intervals.png"
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/select_genes.ipynb --workflow genes \
            --screenshot "$RUNNER_TEMP/select-genes.png"
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/pick_genes.ipynb --workflow points \
            --screenshot "$RUNNER_TEMP/pick-genes.png"
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/edit_sequence.ipynb --workflow sequence \
            --screenshot "$RUNNER_TEMP/edit-sequence.png"
      - name: Verify the agent guide notebook roundtrip
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            docs/agents/embed-api.md --workflow agent-embed \
            --screenshot "$RUNNER_TEMP/agent-embed.png"
      - name: Exercise Python-linked chart widgets
        run: |
          "$RUNNER_TEMP/notebook-env/bin/python" tools/check_notebook_rendering.py \
            notebooks/penguin_python_roundtrip.ipynb --workflow python-rows \
            --screenshot "$RUNNER_TEMP/python-rows.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: notebook-rendering
          path: |
            ${{ runner.temp }}/notebook-rendering.png
            ${{ runner.temp }}/embed-api.png
            ${{ runner.temp }}/annotate-intervals.png
            ${{ runner.temp }}/select-genes.png
            ${{ runner.temp }}/pick-genes.png
            ${{ runner.temp }}/edit-sequence.png
          if-no-files-found: ignore
